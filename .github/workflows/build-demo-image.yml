name: build-demo-image

# Builds the Gantry demo image (frappe/erpnext + gantry_whitelabel) and
# pushes it to GHCR. The demo compose references the exact commit tag
# (v16.32.3-gw-<sha>) so deploys are deterministic.
on:
  push:
    branches: [version-16]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gantry-erpnext-demo:v16.32.3-gw-${{ steps.vars.outputs.sha_short }}
