name: make-package-public

# One-shot helper: the demo server pulls this image without registry
# credentials, so the GHCR package must be public. GITHUB_TOKEN has
# write:packages (the local gh token does not), so this runs on the
# Actions side. Trigger manually: gh workflow run make-package-public.yml
on:
  workflow_dispatch:

jobs:
  make-public:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Inspect and fix package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== list (package_type=container) ==="
          gh api "/user/packages?package_type=container" --jq '.[] | {name, visibility, html_url}' || true
          echo "=== list (package_type=docker) ==="
          gh api "/user/packages?package_type=docker" --jq '.[] | {name, visibility}' || true
          for name in gantry_erp_app gantry-erpnext-demo; do
            echo "=== PATCH $name ==="
            gh api --method PATCH "/user/packages/container/$name" -f visibility=public || true
          done
